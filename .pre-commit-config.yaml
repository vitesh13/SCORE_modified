repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        files: ^(src/python|tests|examples/verification|examples/damask|examples/amag)/.*\.{py|ipynb}$
      - id: ruff-format
        files: ^(src/python|tests|examples/verification|examples/damask|examples/amag)/.*\.{py|ipynb}$


  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy  # static type checking
        # mypy . --install-types --non-interactive then pip freeze | grep types- to see what to add
        # additional_dependencies:
        #   - types-pytz

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]  # modernizes syntax for Python 3.10+

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell  # spellchecking
        pass_filenames: false
        args:
          - --unique
          - --config
          - cspell.json
          - README.md
          - CITATION.cff
          - docs/**/*
          - src/cxx/*.{cpp,c,h,hpp}
          - src/python/**/*.py
          - examples/**/*.{md,ipynb}
